name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs the tools pinned in mise.toml (Rust, rumdl, Usage, jq), puts
      # them on PATH for later steps, and caches the mise installs.
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7

      # Caches the cargo registry and target/. Runs after mise so it keys on
      # the pinned Rust version.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Lint
        run: mise run lint

      # The parser conformance test in src/cli.rs runs the Usage CLI, which
      # mise-action has put on PATH.
      - name: Test
        run: mise run test
