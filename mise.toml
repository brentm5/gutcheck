[tools]
jq = "1.8.2"
rumdl = "0.3.2"
rust = { version = "1.99.1", components = "clippy,rustfmt" }
usage = "7.3.0"

[tasks."lint:md"]
description = "Lint Markdown files"
run = "rumdl check ."

[tasks."fmt:md"]
description = "Format Markdown files"
run = "rumdl fmt ."

[tasks."lint:rust"]
description = "Lint Rust code with clippy (warnings are errors)"
run = "cargo clippy --all-targets -- -D warnings"

[tasks."lint:usage"]
description = "Validate the Usage CLI specification"
run = "usage lint --warnings-as-errors gutcheck.usage.kdl"

[tasks."fmt:rust"]
description = "Format Rust code"
run = "cargo fmt"

[tasks.lint]
description = "Run all linters"
depends = ["lint:md", "lint:rust", "lint:usage"]

[tasks.fmt]
description = "Run all formatters"
depends = ["fmt:md", "fmt:rust"]

[tasks.build]
description = "Build the release binary (target/release/gutcheck)"
run = "cargo build --release"

[tasks.test]
description = "Run all tests"
run = "cargo test"

[tasks."spec:update"]
description = "Download the latest OpenAPI spec to spec/openapi.json"
# Pretty-printed so that changes to the spec are readable in review.
run = """
#!/usr/bin/env bash
set -euo pipefail
tmp=$(mktemp)
trap 'rm -f "$tmp"' EXIT
curl -fsSL https://api.typesafe.ai/openapi.json | jq -e . > "$tmp"
mv "$tmp" spec/openapi.json
"""

[tasks."spec:usage"]
description = "Regenerate the CLI spec from the executable's Usage declarations"
run = """
set -eu
usage_spec_tmp=$(mktemp)
trap 'rm -f "$usage_spec_tmp"' EXIT
cargo run --locked --quiet -- __usage_spec__ > "$usage_spec_tmp"
mv "$usage_spec_tmp" gutcheck.usage.kdl
"""
